apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: three-tier-prod

resources:
  - namespace.yaml
  - ../../base

configMapGenerator:
  - name: deploy-params
    envs:
      - params.env
    options:
      disableNameSuffixHash: true
      annotations:
        config.kubernetes.io/local-config: "true"

patches:
  - target: { kind: Deployment, name: api }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests: { cpu: 250m, memory: 256Mi }
          limits: { memory: 512Mi }
      - op: replace
        path: /spec/template/spec/topologySpreadConstraints/0/whenUnsatisfiable
        value: DoNotSchedule
  - target: { kind: Deployment, name: frontend }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  - target: { kind: HorizontalPodAutoscaler, name: api }
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 12
  - target: { kind: HorizontalPodAutoscaler, name: frontend }
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 6
  - target: { kind: PodDisruptionBudget }
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 2
  - target: { kind: ConfigMap, name: api-config }
    patch: |-
      - op: replace
        path: /data/PGPOOL_MAX
        value: "20"

replacements:
  - source: { kind: ConfigMap, name: deploy-params, fieldPath: data.KEYVAULT_NAME }
    targets:
      - select: { kind: SecretProviderClass, name: api-db }
        fieldPaths: [spec.parameters.keyvaultName]
  - source: { kind: ConfigMap, name: deploy-params, fieldPath: data.TENANT_ID }
    targets:
      - select: { kind: SecretProviderClass, name: api-db }
        fieldPaths: [spec.parameters.tenantId]
  - source: { kind: ConfigMap, name: deploy-params, fieldPath: data.WORKLOAD_CLIENT_ID }
    targets:
      - select: { kind: SecretProviderClass, name: api-db }
        fieldPaths: [spec.parameters.clientID]
      - select: { kind: ServiceAccount, name: api }
        fieldPaths: ["metadata.annotations.[azure.workload.identity/client-id]"]
  - source: { kind: ConfigMap, name: deploy-params, fieldPath: data.APP_HOST }
    targets:
      - select: { kind: Ingress, name: app }
        fieldPaths: [spec.rules.0.host, spec.tls.0.hosts.0]
