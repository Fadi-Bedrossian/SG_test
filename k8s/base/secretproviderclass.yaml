# Azure Key Vault -> Kubernetes Secret sync via the Secrets Store CSI driver (AKS add-on).
# Terraform writes pg-host / pg-user / pg-password into Key Vault.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: api-db
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: REPLACED_BY_OVERLAY
    keyvaultName: REPLACED_BY_OVERLAY
    tenantId: REPLACED_BY_OVERLAY
    objects: |
      array:
        - |
          objectName: pg-host
          objectType: secret
        - |
          objectName: pg-user
          objectType: secret
        - |
          objectName: pg-password
          objectType: secret
  secretObjects:
    - secretName: api-db
      type: Opaque
      data:
        - objectName: pg-host
          key: PGHOST
        - objectName: pg-user
          key: PGUSER
        - objectName: pg-password
          key: PGPASSWORD
